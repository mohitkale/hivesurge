<!doctype html>
<html>
  <body style="margin: 0; background: transparent">
    <canvas id="c" width="128" height="128"></canvas>
    <script type="module">
      // Skin picker preview (PR 069): ?id=<skin>, 128x128, transparent, the battle-camera angle.
      import * as THREE from 'three';
      import { SKINS, skinGeometry } from '/src/art/skins.ts';
      const skin = SKINS.find((s) => s.id === new URLSearchParams(location.search).get('id'));
      const r = new THREE.WebGLRenderer({
        canvas: document.getElementById('c'),
        antialias: true,
        alpha: true,
      });
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.setClearColor(0x000000, 0);
      const s = new THREE.Scene();
      s.add(new THREE.HemisphereLight('#fff6e0', '#6b8f4e', 1.6));
      const d = new THREE.DirectionalLight('#fff', 1.6);
      d.position.set(-6, 14, 6);
      s.add(d);
      const m = new THREE.Mesh(
        skinGeometry(skin, 1),
        new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }),
      );
      m.rotation.y = Math.PI;
      s.add(m);
      const c = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
      c.position.set(1.6, 3.2, 2.6);
      c.lookAt(0, 0.1, 0);
      r.render(s, c);
      document.title = 'ready';
    </script>
  </body>
</html>
