<!doctype html>
<html>
  <body style="margin: 0; background: #fff1dc">
    <canvas id="c" width="500" height="250"></canvas>
    <script type="module">
      // Wasp band check: battle-camera angle (from above, facing the player), lit | unlit (low tier).
      import * as THREE from 'three';
      import { waspGeometry } from '/src/art/models.ts';
      const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.setScissorTest(true);
      const mats = [
        new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }),
        new THREE.MeshBasicMaterial({ vertexColors: true }),
      ];
      mats.forEach((mat, i) => {
        const s = new THREE.Scene();
        s.background = new THREE.Color('#7cc46a');
        s.add(new THREE.HemisphereLight('#fff6e0', '#6b8f4e', 1.6));
        const d = new THREE.DirectionalLight('#fff', 1.6);
        d.position.set(-6, 14, 6);
        s.add(d);
        s.add(new THREE.Mesh(waspGeometry(1), mat));
        const c = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
        c.position.set(0, 4.2, -0.6);
        c.lookAt(0, 0, -0.1);
        r.setViewport(i * 250, 0, 240, 240);
        r.setScissor(i * 250, 0, 240, 240);
        r.render(s, c);
      });
      document.title = 'ready';
    </script>
  </body>
</html>
